<!doctype html>
<html><head><meta charset="utf-8"><title>Adventurer Plates logo</title>
<style>html,body{margin:0;width:400px;height:400px;overflow:hidden;background:#141a26}</style></head>
<body>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#26324a"/><stop offset="1" stop-color="#0f141f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#b9862f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2436"/><stop offset="1" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- the plate: a landscape card, slightly tilted -->
  <g transform="rotate(-6 200 205)">
    <rect x="52" y="112" width="296" height="186" rx="16" fill="url(#card)" stroke="url(#gold)" stroke-width="6"/>
    <!-- portrait panel -->
    <rect x="248" y="126" width="86" height="158" rx="8" fill="#0c111b" stroke="#3a4868" stroke-width="2"/>
    <circle cx="291" cy="178" r="20" fill="#5aa9d6"/>
    <path d="M258 272 C262 226, 320 226, 324 272 Z" fill="#5aa9d6"/>
    <!-- name line -->
    <rect x="72" y="134" width="120" height="12" rx="6" fill="url(#gold)"/>
    <rect x="72" y="154" width="72" height="7" rx="3.5" fill="#6d7a96"/>
    <!-- playstyle badges -->
    <rect x="72"  y="178" width="30" height="24" rx="4" fill="#5b8fe0"/>
    <rect x="108" y="178" width="30" height="24" rx="4" fill="#c79be8"/>
    <rect x="144" y="178" width="30" height="24" rx="4" fill="#e3c34a"/>
    <rect x="180" y="178" width="30" height="24" rx="4" fill="#6fcf8a"/>
    <!-- active-hours strip -->
    <g fill="#2c3650">
      <rect x="72" y="218" width="10" height="10"/><rect x="85" y="218" width="10" height="10"/>
      <rect x="98" y="218" width="10" height="10"/><rect x="111" y="218" width="10" height="10"/>
      <rect x="124" y="218" width="10" height="10"/>
    </g>
    <g fill="#8fd16b">
      <rect x="137" y="218" width="10" height="10"/><rect x="150" y="218" width="10" height="10"/>
      <rect x="163" y="218" width="10" height="10"/><rect x="176" y="218" width="10" height="10"/>
      <rect x="189" y="218" width="10" height="10"/><rect x="202" y="218" width="10" height="10"/>
    </g>
    <!-- motto lines -->
    <rect x="72" y="246" width="156" height="6" rx="3" fill="#8793ad"/>
    <rect x="72" y="260" width="118" height="6" rx="3" fill="#8793ad"/>
  </g>
</svg>
</body></html>
