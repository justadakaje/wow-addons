name: Validate addon structure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # These steps deliberately call the same scripts a developer runs
      # locally, rather than reimplementing the checks in bash.
      #
      # The previous inline version had drifted from scripts/check-toc.js: it
      # resolved .toc file references without normalising path separators, so
      # it agreed with the local checker only while every .toc listed bare
      # filenames. The moment one referenced a subdirectory
      # (`libs\Chomp\Chomp.xml`) the two disagreed -- green locally, red here.
      #
      # Backslashes are correct in a .toc. The checker has to handle them, and
      # there should only be one checker.

      - name: Validate .toc files
        run: node scripts/check-toc.js

      - name: Syntax-check Lua
        run: |
          npm install --no-save --no-audit --no-fund luaparse
          node scripts/check-lua.js

      - name: Run per-addon test suites (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "addons" ]; then
            exit 0
          fi
          for dir in addons/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "running tests for $(basename "$dir")"
              (cd "$dir" && npm ci && npm test)
            fi
          done
