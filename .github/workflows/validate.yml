name: Validate addon structure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check each addon has a valid .toc
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "addons" ]; then
            echo "No addons/ directory yet — nothing to validate."
            exit 0
          fi

          fail=0

          for dir in addons/*/; do
            name=$(basename "$dir")
            tocs=("$dir"*.toc)

            if [ ! -e "${tocs[0]}" ]; then
              echo "::error::$name has no .toc file"
              fail=1
              continue
            fi

            for toc in "${tocs[@]}"; do
              if ! grep -q "^## Interface:" "$toc"; then
                echo "::error file=$toc::missing '## Interface:' line"
                fail=1
              fi
              if ! grep -q "^## Title:" "$toc"; then
                echo "::error file=$toc::missing '## Title:' line"
                fail=1
              fi

              # Every non-comment, non-blank line in the .toc should reference
              # a file that actually exists relative to the addon folder.
              while IFS= read -r line; do
                line="${line%$'\r'}"
                [ -z "$line" ] && continue
                [[ "$line" == \#* ]] && continue
                if [ ! -f "$dir$line" ]; then
                  echo "::error file=$toc::references missing file '$line'"
                  fail=1
                fi
              done < "$toc"
            done

            echo "checked $name (${#tocs[@]} .toc file(s))"
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Run per-addon test suites (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "addons" ]; then
            exit 0
          fi
          for dir in addons/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "running tests for $(basename "$dir")"
              (cd "$dir" && npm ci && npm test)
            fi
          done
